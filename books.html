<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books - Library Management</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">Library Management</div>

    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="books.html" class="active">Books</a>
        <a href="members.html">Members</a>
        <a href="borrowings.html">Borrowings</a>
    </div>
</nav>


<main class="container">

    <div class="page-header">
        <h1>Books</h1>

        <button class="btn btn-primary" onclick="openBookForm()">
            Add Book
        </button>
    </div>


    <div id="message" class="message"></div>


    <!-- Book Form -->

    <div id="bookFormContainer" class="form-container hidden">

        <h2 id="formTitle">Add Book</h2>

        <form id="bookForm">

            <input type="hidden" id="bookId">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" required>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn">
            </div>

            <div class="form-group">
                <label for="categoryId">Category</label>
                <select id="categoryId" required>
                    <option value="">Select Category</option>
                </select>
            </div>

            <div class="form-group">
                <label for="totalCount">Total Count</label>
                <input type="number" id="totalCount" min="1" required>
            </div>

            <div class="form-actions">

                <button type="submit" class="btn btn-primary">
                    Save
                </button>

                <button type="button"
                        class="btn btn-secondary"
                        onclick="closeBookForm()">
                    Cancel
                </button>

            </div>

        </form>

    </div>


    <!-- Books Table -->

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Total</th>
                <th>Available</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="booksTableBody">
            </tbody>

        </table>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/books.js"></script>

</body>
</html>
